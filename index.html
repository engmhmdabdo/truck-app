<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إدارة حسابات سيارات النقل</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="manifest" href="./manifest.json">
    <style>
        body { font-family: 'Tajawal', sans-serif; background-color: #f8fafc; }
        .bg-primary { background-color: #1e3a8a; } /* blue-900 */
        .text-primary { color: #1e3a8a; }
        .bg-secondary { background-color: #3b82f6; } /* blue-500 */
        .text-secondary { color: #3b82f6; }
        .bg-success { background-color: #10b981; } /* emerald-500 */
        .text-success { color: #10b981; }
        .bg-danger { background-color: #ef4444; } /* red-500 */
        .text-danger { color: #ef4444; }
        
        /* شريط التمرير */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="text-gray-800">
    <header class="bg-primary text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-6 sm:px-6 lg:px-8 flex items-center gap-4">
            <div class="bg-white/20 p-3 rounded-xl">
                <i class="fa-solid fa-truck-moving text-3xl"></i>
            </div>
            <div class="flex-1">
                <h1 class="text-2xl font-bold">نظام إدارة حسابات سيارات النقل</h1>
                <p class="text-sm text-blue-200 mt-1">سجل الدخل، المنصرف، وتابع أرباح كل سيارة بسهولة</p>
            </div>
            <!-- زر تثبيت التطبيق -->
            <button id="installAppBtn" class="hidden bg-white text-primary font-bold py-2 px-4 rounded-lg shadow-sm hover:bg-gray-100 transition duration-200 flex items-center gap-2 text-sm sm:text-base">
                <i class="fa-solid fa-download"></i>
                <span class="hidden sm:inline">تثبيت التطبيق</span>
            </button>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-8 pb-20">
        <!-- كروت الملخص -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="bg-white rounded-2xl p-6 shadow-sm border border-gray-100 flex items-center justify-between">
                <div><p class="text-gray-500 text-sm font-medium mb-1">الإيرادات</p><h3 class="text-2xl font-bold text-success"><span id="totalIncome">0</span> ج.م</h3></div>
                <div class="w-12 h-12 rounded-full bg-green-100 flex items-center justify-center text-success text-xl"><i class="fa-solid fa-arrow-trend-up"></i></div>
            </div>
            <div class="bg-white rounded-2xl p-6 shadow-sm border border-gray-100 flex items-center justify-between">
                <div><p class="text-gray-500 text-sm font-medium mb-1">المصروفات</p><h3 class="text-2xl font-bold text-danger"><span id="totalExpense">0</span> ج.م</h3></div>
                <div class="w-12 h-12 rounded-full bg-red-100 flex items-center justify-center text-danger text-xl"><i class="fa-solid fa-arrow-trend-down"></i></div>
            </div>
            <div class="bg-white rounded-2xl p-6 shadow-sm border border-gray-100 flex items-center justify-between">
                <div><p class="text-gray-500 text-sm font-medium mb-1">الربح</p><h3 class="text-2xl font-bold text-primary"><span id="netProfit">0</span> ج.م</h3></div>
                <div class="w-12 h-12 rounded-full bg-blue-100 flex items-center justify-center text-secondary text-xl"><i class="fa-solid fa-wallet"></i></div>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- قسم إدخال البيانات -->
            <div class="lg:col-span-1 space-y-8">
                <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6">
                    <h2 class="text-lg font-bold text-gray-800 mb-6 flex items-center gap-2">
                        <i class="fa-solid fa-circle-plus text-secondary"></i> تسجيل معاملة
                    </h2>
                    <form id="transactionForm" class="space-y-4">
                        <div class="flex gap-4 mb-4">
                            <label class="flex-1 relative">
                                <input type="radio" name="type" value="income" class="peer sr-only" checked>
                                <div class="text-center p-3 rounded-lg border-2 border-gray-200 cursor-pointer peer-checked:border-green-500 peer-checked:bg-green-50 peer-checked:text-green-600 font-bold transition">إيراد</div>
                            </label>
                            <label class="flex-1 relative">
                                <input type="radio" name="type" value="expense" class="peer sr-only">
                                <div class="text-center p-3 rounded-lg border-2 border-gray-200 cursor-pointer peer-checked:border-red-500 peer-checked:bg-red-50 peer-checked:text-red-600 font-bold transition">منصرف</div>
                            </label>
                        </div>
                        
                        <div><label class="block text-sm font-medium text-gray-700 mb-1">السيارة</label><input type="text" id="truck" required class="w-full px-4 py-2 border border-gray-300 rounded-lg"></div>
                        <div><label class="block text-sm font-medium text-gray-700 mb-1">المبلغ</label><input type="number" id="amount" required min="1" step="0.01" class="w-full px-4 py-2 border border-gray-300 rounded-lg"></div>
                        <div><label class="block text-sm font-medium text-gray-700 mb-1">التاريخ</label><input type="date" id="date" required class="w-full px-4 py-2 border border-gray-300 rounded-lg"></div>
                        
                        <!-- قسم الفئة الديناميكي -->
                        <div id="categoryContainer">
                            <div class="flex justify-between items-end mb-1">
                                <label class="block text-sm font-medium text-gray-700">الفئة</label>
                                <button type="button" onclick="openCategoryModal()" class="text-xs text-secondary hover:text-blue-800 flex items-center gap-1 font-bold">
                                    <i class="fa-solid fa-gear"></i> إدارة الفئات
                                </button>
                            </div>
                            <select id="category" required class="w-full px-4 py-2 border border-gray-300 rounded-lg"></select>
                        </div>
                        
                        <div><label class="block text-sm font-medium text-gray-700 mb-1">الوصف</label><input type="text" id="description" required class="w-full px-4 py-2 border border-gray-300 rounded-lg"></div>
                        <button type="submit" class="w-full bg-primary hover:bg-blue-800 text-white font-bold py-3 px-4 rounded-lg shadow-md mt-4 transition">حفظ المعاملة</button>
                    </form>
                </div>
            </div>

            <div class="lg:col-span-2 space-y-6">
                
                <!-- الرسوم البيانية -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 hidden md:block">
                        <h2 class="text-lg font-bold text-gray-800 mb-4 border-b pb-2 text-center"><i class="fa-solid fa-chart-pie text-red-500 ml-2"></i>المنصرفات بالفئات</h2>
                        <div class="relative h-48 w-full"><canvas id="expensesChart"></canvas></div>
                    </div>
                    
                    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 hidden md:block">
                        <h2 class="text-lg font-bold text-gray-800 mb-4 border-b pb-2 text-center"><i class="fa-solid fa-chart-pie text-green-500 ml-2"></i>الإيرادات بالفئات</h2>
                        <div class="relative h-48 w-full"><canvas id="incomeCategoryChart"></canvas></div>
                    </div>
                    
                    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 hidden md:block md:col-span-2">
                        <h2 class="text-lg font-bold text-gray-800 mb-4 border-b pb-2 text-center"><i class="fa-solid fa-scale-balanced text-blue-500 ml-2"></i>الإيرادات مقابل المصروفات</h2>
                        <div class="relative h-64 w-full flex justify-center"><canvas id="incomeExpenseChart"></canvas></div>
                    </div>
                </div>

                <!-- جدول عرض المعاملات -->
                <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
                    <div class="p-4 border-b border-gray-100 flex justify-between items-center bg-gray-50">
                        <select id="filterTruck" class="px-4 py-2 border border-gray-300 rounded-lg text-sm bg-white"></select>
                        <button onclick="exportToCSV()" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg text-sm font-bold flex items-center gap-2 transition"><i class="fa-solid fa-file-excel"></i> تصدير Excel</button>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="min-w-full divide-y divide-gray-200">
                            <thead class="bg-gray-50"><tr>
                                <th class="px-4 py-3 text-right text-xs font-bold text-gray-500">التاريخ</th>
                                <th class="px-4 py-3 text-right text-xs font-bold text-gray-500">السيارة</th>
                                <th class="px-4 py-3 text-right text-xs font-bold text-gray-500">البيان والفئة</th>
                                <th class="px-4 py-3 text-right text-xs font-bold text-gray-500">المبلغ</th>
                                <th class="px-4 py-3 text-right text-xs font-bold text-gray-500">إجراء</th>
                            </tr></thead>
                            <tbody id="transactionList" class="bg-white divide-y divide-gray-200"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <!-- نافذة إدارة الفئات (Modal) -->
        <div id="categoryModal" class="fixed inset-0 bg-black/50 hidden z-50 flex items-center justify-center p-4">
            <div class="bg-white rounded-2xl shadow-xl w-full max-w-md overflow-hidden transform transition-all">
                <div class="p-4 border-b flex justify-between items-center bg-gray-50">
                    <h3 class="text-lg font-bold text-gray-800">إعدادات الفئات والألوان</h3>
                    <button onclick="closeCategoryModal()" class="text-gray-500 hover:text-red-500"><i class="fa-solid fa-xmark text-xl"></i></button>
                </div>
                <div class="p-6">
                    <div class="flex gap-2 mb-4">
                        <button onclick="renderCategoryList('expense')" id="btnManageExpense" class="flex-1 py-2 rounded-lg font-bold bg-red-100 text-red-700 transition">المنصرفات</button>
                        <button onclick="renderCategoryList('income')" id="btnManageIncome" class="flex-1 py-2 rounded-lg font-bold bg-gray-100 text-gray-600 transition">الإيرادات</button>
                    </div>
                    
                    <form id="addCategoryForm" class="flex gap-2 mb-6">
                        <input type="text" id="newCategoryName" placeholder="اسم الفئة الجديدة..." required class="flex-1 px-3 py-2 border border-gray-300 rounded-lg">
                        <input type="color" id="newCategoryColor" value="#3b82f6" class="w-10 h-10 p-1 border border-gray-300 rounded-lg cursor-pointer" title="اختر لون الفئة">
                        <button type="submit" class="bg-primary text-white px-4 py-2 rounded-lg hover:bg-blue-800 transition"><i class="fa-solid fa-plus"></i></button>
                    </form>

                    <div class="max-h-60 overflow-y-auto pr-2">
                        <ul id="categoryManagerList" class="space-y-2"></ul>
                    </div>
                </div>
            </div>
        </div>
        <!-- نهاية النافذة المنبثقة -->
    </main>

    <script>
        // المتغيرات الأساسية
        let transactions = [];
        let expenseChartInstance = null;
        let incomeCategoryChartInstance = null;
        let incomeExpenseChartInstance = null;

        // الفئات الافتراضية وألوانها
        let customCategories = {
            expense: [
                { name: "وقود", color: "#ef4444" },
                { name: "صيانة", color: "#f59e0b" },
                { name: "كاوتش", color: "#8b5cf6" },
                { name: "كارتة", color: "#ec4899" },
                { name: "رواتب", color: "#3b82f6" },
                { name: "مخالفات", color: "#64748b" },
                { name: "أخرى", color: "#94a3b8" }
            ],
            income: [
                { name: "نقلة", color: "#10b981" },
                { name: "عهدة", color: "#0ea5e9" },
                { name: "أخرى", color: "#94a3b8" }
            ]
        };
        let currentManagingType = 'income';

        // عناصر واجهة المستخدم
        const form = document.getElementById('transactionForm');
        const list = document.getElementById('transactionList');
        const filterSelect = document.getElementById('filterTruck');
        const typeRadios = document.querySelectorAll('input[name="type"]');
        const categorySelect = document.getElementById('category');
        const dateInput = document.getElementById('date');
        const categoryModal = document.getElementById('categoryModal');

        // تعيين تاريخ اليوم افتراضياً
        if(dateInput) dateInput.valueAsDate = new Date();

        const installAppBtn = document.getElementById('installAppBtn');
        let deferredPrompt;
        // التأكد من أن المستخدم ليس داخل التطبيق المثبت بالفعل
        const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;

        if (installAppBtn && !isStandalone) {
            installAppBtn.classList.remove('hidden'); // إظهار الزر على المتصفح
            window.addEventListener('beforeinstallprompt', (e) => {
                e.preventDefault();
                deferredPrompt = e;
            });
            installAppBtn.addEventListener('click', async () => {
                if (deferredPrompt) {
                    deferredPrompt.prompt();
                    const { outcome } = await deferredPrompt.userChoice;
                    if (outcome === 'accepted') {
                        installAppBtn.classList.add('hidden');
                    }
                    deferredPrompt = null;
                } else {
                    alert('كيفية تثبيت التطبيق:\n\n📱 أندرويد: اضغط على قائمة المتصفح (الثلاث نقاط) واختر "الإضافة إلى الشاشة الرئيسية" (Add to Home screen).\n\n🍏 آيفون: اضغط على زر المشاركة بالأسفل واختر "إضافة إلى الصفحة الرئيسية" (Add to Home screen).\n\nملاحظة: إذا لم تجد الخيار، فقد يكون التطبيق مثبتاً بالفعل على جهازك.');
                }
            });
            window.addEventListener('appinstalled', () => {
                installAppBtn.classList.add('hidden');
            });
        }

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW Error:', err));
            });
        }

        // تحديث خيارات الفئة بناءً على النوع المختار (إيراد/منصرف)
        function updateCategoryDropdown(type) {
            if(!categorySelect) return;
            categorySelect.innerHTML = '';
            if(customCategories[type]) {
                customCategories[type].forEach(cat => {
                    categorySelect.appendChild(new Option(cat.name, cat.name));
                });
            }
        }

        // الاستماع لتغيير نوع المعاملة
        typeRadios.forEach(radio => {
            radio.addEventListener('change', (e) => {
                updateCategoryDropdown(e.target.value);
            });
        });

        // جلب البيانات من الذاكرة المحلية
        function loadData() {
            const saved = localStorage.getItem('transport_data');
            if (saved) { try { transactions = JSON.parse(saved); } catch(e) { transactions = []; } }
            
            const savedCategories = localStorage.getItem('transport_categories');
            if (savedCategories) { try { customCategories = JSON.parse(savedCategories); } catch(e) {} }

            const checkedRadio = document.querySelector('input[name="type"]:checked');
            if(checkedRadio) updateCategoryDropdown(checkedRadio.value);
            
            updateTruckFilter();
            updateUI();
        }

        // حفظ البيانات في الذاكرة المحلية
        function saveData() {
            localStorage.setItem('transport_data', JSON.stringify(transactions));
            localStorage.setItem('transport_categories', JSON.stringify(customCategories));
            updateTruckFilter();
            updateUI();
        }

        window.openCategoryModal = function() {
            if(categoryModal) categoryModal.classList.remove('hidden');
            const checkedType = document.querySelector('input[name="type"]:checked');
            const currentType = checkedType ? checkedType.value : 'income';
            renderCategoryList(currentType);
        };

        window.closeCategoryModal = function() {
            if(categoryModal) categoryModal.classList.add('hidden');
            const checkedType = document.querySelector('input[name="type"]:checked');
            const currentType = checkedType ? checkedType.value : 'income';
            updateCategoryDropdown(currentType);
            updateUI(); // تحديث الألوان في الرسوم البيانية
        };

        window.renderCategoryList = function(type) {
            currentManagingType = type;
            const btnExp = document.getElementById('btnManageExpense');
            const btnInc = document.getElementById('btnManageIncome');
            
            if(btnExp && btnInc) {
                btnExp.className = type === 'expense' ? 'flex-1 py-2 rounded-lg font-bold bg-red-100 text-red-700 shadow-sm' : 'flex-1 py-2 rounded-lg font-bold bg-gray-100 text-gray-600 hover:bg-gray-200';
                btnInc.className = type === 'income' ? 'flex-1 py-2 rounded-lg font-bold bg-green-100 text-green-700 shadow-sm' : 'flex-1 py-2 rounded-lg font-bold bg-gray-100 text-gray-600 hover:bg-gray-200';
            }
            
            const ul = document.getElementById('categoryManagerList');
            if(!ul) return;
            ul.innerHTML = '';
            
            customCategories[type].forEach((cat, index) => {
                ul.innerHTML += `
                    <li class="flex justify-between items-center bg-gray-50 p-2 rounded-lg border border-gray-200">
                        <div class="flex items-center gap-3">
                            <input type="color" value="${cat.color}" onchange="updateCategoryColor('${type}', ${index}, this.value)" class="w-8 h-8 p-0 border-0 rounded cursor-pointer" title="تغيير اللون">
                            <span class="text-sm font-semibold">${cat.name}</span>
                        </div>
                        <button type="button" onclick="deleteCustomCategory('${type}', ${index})" class="text-red-500 hover:text-red-700 p-2 bg-red-50 rounded-lg"><i class="fa-solid fa-trash"></i></button>
                    </li>
                `;
            });
        };

        window.updateCategoryColor = function(type, index, newColor) {
            customCategories[type][index].color = newColor;
            saveData();
            updateUI(); // يطبق التغيير فورا
        };

        const addCategoryForm = document.getElementById('addCategoryForm');
        if(addCategoryForm) {
            addCategoryForm.addEventListener('submit', function(e) {
                e.preventDefault();
                const nameInput = document.getElementById('newCategoryName');
                const colorInput = document.getElementById('newCategoryColor');
                
                if(nameInput.value.trim() === '') return;
                
                customCategories[currentManagingType].push({
                    name: nameInput.value.trim(),
                    color: colorInput.value
                });
                
                saveData();
                renderCategoryList(currentManagingType);
                nameInput.value = '';
            });
        }

        window.deleteCustomCategory = function(type, index) {
            if(confirm('هل أنت متأكد من حذف هذه الفئة؟ سيتم الاحتفاظ بالمعاملات القديمة المسجلة بها.')) {
                customCategories[type].splice(index, 1);
                saveData();
                renderCategoryList(type);
            }
        };

        function updateTruckFilter() {
            const currentVal = filterSelect.value;
            const trucks = [...new Set(transactions.map(t => t.truck))];
            filterSelect.innerHTML = '<option value="all">جميع السيارات</option>';
            trucks.forEach(t => filterSelect.appendChild(new Option(t, t)));
            if (trucks.includes(currentVal)) filterSelect.value = currentVal;
        }

        filterSelect.addEventListener('change', updateUI);

        function updateUI() {
            const filterValue = filterSelect.value;
            let filtered = filterValue === 'all' ? transactions : transactions.filter(t => t.truck === filterValue);
            
            const income = filtered.filter(t => t.type === 'income').reduce((acc, t) => acc + t.amount, 0);
            const expense = filtered.filter(t => t.type === 'expense').reduce((acc, t) => acc + t.amount, 0);
            
            document.getElementById('totalIncome').textContent = income.toLocaleString('ar-EG');
            document.getElementById('totalExpense').textContent = expense.toLocaleString('ar-EG');
            document.getElementById('netProfit').textContent = (income - expense).toLocaleString('ar-EG');
            
            updateChart(filtered);
            
            list.innerHTML = '';
            filtered.sort((a, b) => new Date(b.date) - new Date(a.date)).forEach(t => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-gray-50 transition-colors";
                const amntClass = t.type === 'income' ? 'text-success' : 'text-danger';
                const cat = t.category ? `<span class="inline-block bg-gray-100 text-gray-600 text-xs px-2 py-1 rounded mt-1 font-bold">${t.category}</span>` : ''; 
                tr.innerHTML = `
                    <td class="px-4 py-4 whitespace-nowrap text-sm text-gray-600">${new Date(t.date).toLocaleDateString('ar-EG')}</td>
                    <td class="px-4 py-4 font-bold text-sm text-gray-800">${t.truck}</td>
                    <td class="px-4 py-4 text-sm text-gray-700"><div>${t.description}</div>${cat}</td>
                    <td class="px-4 py-4 font-bold ${amntClass}" dir="ltr">${t.amount.toLocaleString('ar-EG')}</td>
                    <td class="px-4 py-4"><button onclick="deleteTransaction(${t.id})" class="text-red-500 hover:text-red-700 bg-red-50 p-2 rounded-lg transition"><i class="fa-solid fa-trash"></i></button></td>
                `;
                list.appendChild(tr);
            });
        }

        // استخراج لون الفئة للرسم البياني
        function getCategoryColor(type, categoryName) {
            const cat = customCategories[type].find(c => c.name === categoryName);
            return cat ? cat.color : (type === 'income' ? '#34d399' : '#f87171'); 
        }

        function updateChart(filtered) {
            // 1. رسم المنصرفات
            const canvasExp = document.getElementById('expensesChart');
            if(canvasExp) {
                const expenses = filtered.filter(t => t.type === 'expense');
                const totalsExp = {};
                expenses.forEach(t => totalsExp[t.category || 'أخرى'] = (totalsExp[t.category || 'أخرى'] || 0) + t.amount);
                
                const labelsExp = Object.keys(totalsExp);
                const dataExp = Object.values(totalsExp);
                const colorsExp = labelsExp.map(label => getCategoryColor('expense', label));

                if (expenseChartInstance) expenseChartInstance.destroy();
                if(expenses.length > 0) {
                    expenseChartInstance = new Chart(canvasExp.getContext('2d'), {
                        type: 'doughnut',
                        data: { labels: labelsExp, datasets: [{ data: dataExp, backgroundColor: colorsExp, borderWidth: 1 }] },
                        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'right', rtl: true } } }
                    });
                }
            }

            // 2. رسم الإيرادات
            const canvasInc = document.getElementById('incomeCategoryChart');
            if(canvasInc) {
                const incomes = filtered.filter(t => t.type === 'income');
                const totalsInc = {};
                incomes.forEach(t => totalsInc[t.category || 'أخرى'] = (totalsInc[t.category || 'أخرى'] || 0) + t.amount);
                
                const labelsInc = Object.keys(totalsInc);
                const dataInc = Object.values(totalsInc);
                const colorsInc = labelsInc.map(label => getCategoryColor('income', label));

                if (incomeCategoryChartInstance) incomeCategoryChartInstance.destroy();
                if(incomes.length > 0) {
                    incomeCategoryChartInstance = new Chart(canvasInc.getContext('2d'), {
                        type: 'doughnut',
                        data: { labels: labelsInc, datasets: [{ data: dataInc, backgroundColor: colorsInc, borderWidth: 1 }] },
                        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'right', rtl: true } } }
                    });
                }
            }

            // 3. رسم مقارنة الإيرادات بالمصروفات
            const canvasIE = document.getElementById('incomeExpenseChart');
            if(canvasIE) {
                const totalIncome = filtered.filter(t => t.type === 'income').reduce((acc, t) => acc + t.amount, 0);
                const totalExpense = filtered.filter(t => t.type === 'expense').reduce((acc, t) => acc + t.amount, 0);

                if (incomeExpenseChartInstance) incomeExpenseChartInstance.destroy();
                if (totalIncome > 0 || totalExpense > 0) {
                    incomeExpenseChartInstance = new Chart(canvasIE.getContext('2d'), {
                        type: 'pie',
                        data: {
                            labels: ['الإيرادات', 'المصروفات'],
                            datasets: [{
                                data: [totalIncome, totalExpense],
                                backgroundColor: ['#10b981', '#ef4444'],
                                borderWidth: 2, borderColor: '#ffffff'
                            }]
                        },
                        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom', rtl: true } } }
                    });
                }
            }
        }

        // تسجيل معاملة جديدة
        form.addEventListener('submit', function(e) {
            e.preventDefault();
            const typeElem = document.querySelector('input[name="type"]:checked');
            if(!typeElem) return;
            
            const transaction = {
                id: Date.now(), 
                type: typeElem.value,
                truck: document.getElementById('truck').value.trim(),
                amount: parseFloat(document.getElementById('amount').value),
                date: document.getElementById('date').value,
                category: document.getElementById('category').value,
                description: document.getElementById('description').value.trim()
            };
            transactions.push(transaction);
            saveData();
            document.getElementById('amount').value = '';
            document.getElementById('description').value = '';
        });

        window.deleteTransaction = function(id) {
            if (confirm('هل أنت متأكد من حذف هذه المعاملة؟')) {
                transactions = transactions.filter(t => t.id !== id);
                saveData();
            }
        };

        // تصدير البيانات لإكسيل
        window.exportToCSV = function() {
            if (transactions.length === 0) {
                alert('لا توجد بيانات لتصديرها');
                return;
            }
            
            const BOM = "\uFEFF";
            let csvContent = BOM + "التاريخ,النوع,السيارة,الفئة,البيان,المبلغ\n";
            
            transactions.forEach(t => {
                const typeAr = t.type === 'income' ? 'إيراد' : 'منصرف';
                const row = `"${t.date}","${typeAr}","${t.truck}","${t.category || ''}","${t.description}","${t.amount}"`;
                csvContent += row + "\n";
            });
            
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            const url = URL.createObjectURL(blob);
            link.setAttribute("href", url);
            link.setAttribute("download", `حسابات_النقل_${new Date().toISOString().split('T')[0]}.csv`);
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        };

        // تشغيل التطبيق عند البداية
        loadData();
    </script>
</body>
</html>
